[project]
name = "ifinjected"
version = "0.1.0"
description = "What could a prompt-injected coding agent reach on your machine? Read-only, offline, never prints a secret."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "BhuwanJoshi-01", email = "bhuwanj779@gmail.com" }
]
requires-python = ">=3.11"
keywords = [
    "ai-agents", "coding-agents", "prompt-injection", "security", "secrets", "sandbox",
    "claude-code", "codex", "gemini-cli", "cursor", "mcp", "sarif",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://bhuwanjoshi-01.github.io/ifinjected/"
Source = "https://github.com/BhuwanJoshi-01/ifinjected"
Issues = "https://github.com/BhuwanJoshi-01/ifinjected/issues"
Changelog = "https://github.com/BhuwanJoshi-01/ifinjected/blob/main/CHANGELOG.md"

[project.scripts]
ifinjected = "ifinjected.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "C4",           # comprehensions
    "PTH",          # pathlib
    "S",            # bandit: subprocesses and secret handling must be deliberate
    "PT",           # pytest style
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["ifinjected", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/ifinjected/reports/card.py" = ["E501"]  # SVG markup reads best one element per line
"tests/**" = [
    "S101",  # assert is how pytest works
    "S105", "S106",  # fake secrets are the point of the redaction and canary tests
    "S108",  # /tmp paths are test data
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["ifinjected"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
