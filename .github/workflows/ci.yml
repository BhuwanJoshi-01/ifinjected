name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Agent configuration lives in different places on each system (XDG, Application
          # Support, %APPDATA%, %ProgramData%), so every system runs the whole suite.
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q --cov --cov-report=term

  package:
    # The wheel a user installs must work on its own: build it, install it into an empty
    # environment (no repository, no dev tools) and run the installed command.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build the sdist and wheel
        run: uv build
      - name: The wheel carries the catalog of sensitive items
        run: |
          wheel=$(ls dist/*.whl)
          python -m zipfile -l "$wheel" | grep -q "ifinjected/inventory/catalog.json" || { echo "::error::catalog.json missing from $wheel"; exit 1; }
      - name: Install the wheel into a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/fresh" --python 3.12
          uv pip install --python "$RUNNER_TEMP/fresh" dist/*.whl
      - name: Run the installed command
        run: |
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/fresh/Scripts"; else bin="$RUNNER_TEMP/fresh/bin"; fi
          "$bin/ifinjected" --version
          "$bin/ifinjected" --help > /dev/null
          "$bin/python" -m ifinjected --version
          "$bin/ifinjected" inventory > /dev/null

  audit:
    # Known vulnerabilities in the runtime dependencies (not the dev tools).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: pip-audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit --strict --requirement requirements.txt

  dependency-review:
    # Flags vulnerable or license-incompatible dependencies a pull request adds.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
