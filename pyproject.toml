[project]
name = "ifinjected"
version = "0.1.0.dev0"
description = "What could a prompt-injected coding agent reach on your machine? Read-only, offline, never prints a secret."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "BhuwanJoshi-01", email = "bhuwanj779@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ifinjected = "ifinjected.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
